<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Calculator">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#FFFDF8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#141414" media="(prefers-color-scheme: dark)">
  <title>Calculator</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div id="app">
    <header class="toolbar">
      <div class="toolbar-side"></div>
      <h1 class="page-title" id="page-title"></h1>
      <div class="toolbar-side"></div>
    </header>

    <main class="page" id="page">
      <div class="rows" id="rows"></div>
    </main>

    <footer class="panel" id="panel">
      <div class="accessory">
        <div class="page-dots" id="page-dots"></div>
        <div class="spacer"></div>
        <button type="button" class="undo" id="undo" aria-label="Undo">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5" /><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11" /></svg>
        </button>
      </div>
      <div class="keypad" id="keypad"></div>
    </footer>
  </div>
</body>
</html>
